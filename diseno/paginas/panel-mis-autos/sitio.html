<style>
body{margin:0;background:#F2F2F2}
*{box-sizing:border-box}
a{color:#0B0B0B}a:hover{color:#A30F16}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #0B0B0B;outline-offset:2px;box-shadow:0 0 0 6px #FFFFFF}
button,input{font:inherit}

</helmet>
<div style="font-family: 'Archivo', sans-serif; width: 390px; min-height: 1500px; background: #F2F2F2; color: #0B0B0B; display: flex; flex-direction: column">
  <header style="background: #0B0B0B; color: #FFFFFF; padding: 12px 16px; display: flex; align-items: center; gap: 10px">
    <img src="assets/bd7f10df-2ceb-4946-a225-34d7b385d4d3.png" alt="AutoShop" style="width: 36px; height: 36px; border-radius: 50%">
    <h1 style="margin: 0; font-style: italic; font-weight: 900; font-stretch: 115%; font-size: 21px">Mis autos</h1>
    <a href="Movil-Inicio.dc.html" style="margin-left: auto; color: #FFFFFF; font-size: 14px; font-weight: 700; min-height: 44px; display: inline-flex; align-items: center">Ver la web</a>
  </header>

  <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <label style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 2px solid #8A8A8A; padding: 0 12px">
      <svg aria-hidden="true" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#4A4A4A" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar auto</span>
      <input type="search" placeholder="Buscar por marca o modelo" style="flex: 1; min-width: 0; min-height: 48px; border: 0; background: transparent; font-size: 16px">
    </label>
    <div role="group" aria-label="Filtrar por estado" style="display: flex; gap: 6px; overflow-x: auto">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{t.pressed}}" sc-camel-on-click="{{t.pick}}" style="{{t.style}}">{{t.label}} <span style="font-weight: 500">{{t.n}}</span></button>
      </sc-for>
    </div>
  </div>

  <ul style="list-style: none; margin: 0; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 10px; flex: 1">
    <sc-for list="{{lista}}" as="a" hint-placeholder-count="6">
      <li style="background: #FFFFFF; border: 1px solid #D6D6D6">
        <div style="display: flex; gap: 12px; padding: 10px">
          <div style="position: relative; flex: none">
            <img src="{{a.img}}" alt="" style="width: 104px; height: 78px; object-fit: cover; display: block">
            <sc-if value="{{a.dest}}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; left: 0; top: 0; background: #C8161E; color: #FFFFFF; font-size: 11px; font-weight: 800; padding: 2px 6px; text-transform: uppercase">Destacado</span>
            </sc-if>
          </div>
          <div style="min-width: 0; flex: 1">
            <div style="font-weight: 800; font-size: 16px">{{a.nombre}}</div>
            <div style="font-style: italic; font-weight: 900; font-stretch: 75%; font-size: 24px; line-height: 1.1">U$S {{a.num}}</div>
            <div style="font-size: 13px; color: #4A4A4A">{{a.suc}}</div>
          </div>
        </div>
        <div role="group" aria-label="Estado de {{a.nombre}}" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #D6D6D6">
          <sc-for list="{{a.estados}}" as="e" hint-placeholder-count="3">
            <button type="button" aria-pressed="{{e.pressed}}" sc-camel-on-click="{{e.pick}}" style="{{e.style}}">{{e.label}}</button>
          </sc-for>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #D6D6D6">
          <a href="Panel-Editor.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; font-weight: 700; font-size: 15px; text-decoration: none; border-right: 1px solid #D6D6D6">
            <svg aria-hidden="true" width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0B0B0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
            Editar
          </a>
          <button type="button" aria-pressed="{{a.destPressed}}" sc-camel-on-click="{{a.toggleDest}}" style="min-height: 48px; border: 0; background: transparent; font-weight: 700; font-size: 15px; color: #0B0B0B">{{a.destTxt}}</button>
        </div>
      </li>
    </sc-for>
  </ul>

  <div style="position: sticky; bottom: 0; background: #FFFFFF; border-top: 1px solid #D6D6D6">
    <div style="padding: 10px 16px">
      <a href="Panel-Editor.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; background: #C8161E; color: #FFFFFF; font-weight: 900; font-size: 18px; text-decoration: none">
        <svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        Agregar auto
      </a>
    </div>
    <nav aria-label="Panel" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #D6D6D6">
      <a href="Panel-Autos.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; min-height: 52px; font-weight: 800; font-size: 15px; text-decoration: none; box-shadow: inset 0 3px 0 #C8161E">Autos</a>
      <a href="Panel-Negocio.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; font-weight: 600; font-size: 15px; text-decoration: none; color: #4A4A4A">Datos del negocio</a>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1500}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      filtro: 'Todos',
      autos: [
        { id: 'civic10', nombre: 'Honda Civic', usd: 16900, suc: 'Batlle y Ordóñez', estado: 'Disponible', dest: true, img: '/_blob/6370b0cd4485e77db03eaf1f7ea473e7' },
        { id: 'aqua', nombre: 'Toyota Aqua', usd: 12900, suc: 'Batlle y Ordóñez', estado: 'Disponible', dest: true, img: '/_blob/9cf1fe16f69326749f739d284ca43c44' },
        { id: 'onix', nombre: 'Chevrolet Onix', usd: 12900, suc: 'Batlle y Ordóñez', estado: 'Reservado', dest: false, img: '/_blob/da5fe687ff89811db5a5240669824cf4' },
        { id: 'civic8', nombre: 'Honda Civic', usd: 10900, suc: 'Batlle y Ordóñez', estado: 'Disponible', dest: true, img: '/_blob/f20f0d29903922ae8e7f823ccc9cf12a' },
        { id: 'celysee', nombre: 'Citroën C-Elysée', usd: 10500, suc: 'Batlle y Ordóñez', estado: 'Disponible', dest: false, img: '/_blob/62ac4c8689601be7e28a0645c2d8cd16' },
        { id: 'p308', nombre: 'Peugeot 308', usd: 10500, suc: 'Batlle y Ordóñez', estado: 'Disponible', dest: false, img: '/_blob/d9a7ec5f39c90257835e65e9316f4559' },
        { id: 'yaris', nombre: 'Toyota Yaris', usd: 7900, suc: 'Eugenio Garzón', estado: 'Disponible', dest: true, img: '/_blob/bd03d8ff498b452b07b0960f638bce29' },
        { id: 'sedan', nombre: '[MARCA] [MODELO]', usd: 7200, suc: 'Batlle y Ordóñez', estado: 'Disponible', dest: false, img: '/_blob/7aaf4a89cfc43f88ea9d7cab0975e92a' },
        { id: 'lifan', nombre: 'Lifan 320', usd: 4900, suc: 'Eugenio Garzón', estado: 'Disponible', dest: false, img: '/_blob/85c68a14a73ae539eda1b88864eb045d' }
      ]
    };
  }
  renderVals() {
    const fm = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const A = this.state.autos;
    const upd = (id, patch) => this.setState({ autos: this.state.autos.map((a) => a.id === id ? { ...a, ...patch } : a) });
    const colores = { Disponible: '#1F7A3A', Reservado: '#8A5A00', Vendido: '#4A4A4A' };
    const map = { Disponibles: 'Disponible', Reservados: 'Reservado', Vendidos: 'Vendido' };
    const f = this.state.filtro;
    const tabs = ['Todos', 'Disponibles', 'Reservados', 'Vendidos'].map((t) => ({
      label: t,
      n: t === 'Todos' ? A.length : A.filter((a) => a.estado === map[t]).length,
      pressed: f === t ? 'true' : 'false',
      pick: () => this.setState({ filtro: t }),
      style: 'flex: 0 0 auto; min-height: 44px; padding: 0 14px; font-size: 15px; font-weight: 700; ' + (f === t ? 'background: #0B0B0B; color: #FFFFFF; border: 2px solid #0B0B0B;' : 'background: #FFFFFF; color: #0B0B0B; border: 2px solid #BDBDBD;')
    }));
    const lista = A.filter((a) => f === 'Todos' || a.estado === map[f]).map((a) => ({
      ...a,
      num: fm(a.usd),
      destPressed: a.dest ? 'true' : 'false',
      destTxt: a.dest ? 'Quitar de destacados' : 'Destacar en inicio',
      toggleDest: () => upd(a.id, { dest: !a.dest }),
      estados: ['Disponible', 'Reservado', 'Vendido'].map((e) => ({
        label: e,
        pressed: a.estado === e ? 'true' : 'false',
        pick: () => upd(a.id, { estado: e }),
        style: 'min-height: 48px; border: 0; font-size: 14px; font-weight: 700; ' + (a.estado === e ? 'background: ' + colores[e] + '; color: #FFFFFF;' : 'background: #FFFFFF; color: #4A4A4A;')
      }))
    }));
    return { tabs, lista };
  }
}
</script>
