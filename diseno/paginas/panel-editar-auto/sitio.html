<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:2800}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      fotos: [
        { id: 'f1', real: true, label: 'Frente 3/4' },
        { id: 'f2', real: false, label: '[Lateral]' },
        { id: 'f3', real: false, label: '[Trasera]' },
        { id: 'f4', real: false, label: '[Interior]' },
        { id: 'f5', real: false, label: '[Tablero]' }
      ],
      sel: { comb: 'Nafta', caja: '[sin cargar]', tipo: 'Sedán', suc: 'Batlle y Ordóñez' },
      moneda: 'U$S', estado: 'Disponible', dest: true,
      equipo: { 'Aire acondicionado': true, 'Dirección asistida': true, 'Airbags': true, 'ABS': true, 'Pantalla multimedia': false, 'Cámara de retroceso': false, 'Vidrios eléctricos': true, 'Llantas de aleación': true, 'Sensor de estacionamiento': false, 'Control crucero': false }
    };
  }
  renderVals() {
    const F = this.state.fotos;
    const move = (from, to) => { if (to < 0 || to >= F.length) return; const a = F.slice(); const [x] = a.splice(from, 1); a.splice(to, 0, x); this.setState({ fotos: a }); };
    const fotos = F.map((p, i) => ({
      ...p,
      ph: !p.real,
      portada: i === 0,
      noPortada: i !== 0,
      hacerPortada: () => move(i, 0),
      subir: () => move(i, i - 1),
      bajar: () => move(i, i + 1),
      borrar: () => this.setState({ fotos: F.filter((q) => q.id !== p.id) }),
      subirLabel: 'Subir foto ' + (i + 1),
      bajarLabel: 'Bajar foto ' + (i + 1),
      borrarLabel: 'Borrar foto ' + (i + 1)
    }));
    const chipOn = 'min-height: 44px; padding: 0 12px; background: #0B0B0B; color: #FFFFFF; border: 2px solid #0B0B0B; font-weight: 700; font-size: 15px;';
    const chipOff = 'min-height: 44px; padding: 0 12px; background: #FFFFFF; color: #0B0B0B; border: 2px solid #BDBDBD; font-weight: 600; font-size: 15px;';
    const s = this.state.sel;
    const g = (key, label, opts) => ({ label, opts: opts.map((o) => ({ label: o, pressed: s[key] === o ? 'true' : 'false', style: s[key] === o ? chipOn : chipOff, pick: () => this.setState({ sel: { ...this.state.sel, [key]: o } }) })) });
    const grupos = [
      g('comb', 'Combustible', ['Nafta', 'Diésel', 'Híbrido', 'Eléctrico']),
      g('caja', 'Caja', ['Manual', 'Automática']),
      g('tipo', 'Tipo', ['Sedán', 'Hatchback', 'SUV', 'Pick-up', 'Utilitario']),
      g('suc', 'Sucursal', ['Batlle y Ordóñez', 'Eugenio Garzón'])
    ];
    const seg = (on) => 'min-height: 52px; border: 0; font-weight: 800; font-size: 15px; ' + (on ? 'background: #0B0B0B; color: #FFFFFF;' : 'background: #FFFFFF; color: #0B0B0B;');
    const monedas = ['U$S', '$'].map((m) => ({ label: m, pressed: this.state.moneda === m ? 'true' : 'false', style: seg(this.state.moneda === m) + ' min-width: 56px;', pick: () => this.setState({ moneda: m }) }));
    const estados = ['Disponible', 'Reservado', 'Vendido'].map((e) => ({ label: e, pressed: this.state.estado === e ? 'true' : 'false', style: seg(this.state.estado === e), pick: () => this.setState({ estado: e }) }));
    const E = this.state.equipo;
    const equipo = Object.keys(E).map((k) => ({ label: (E[k] ? '✓ ' : '') + k, pressed: E[k] ? 'true' : 'false', style: E[k] ? chipOn : chipOff, pick: () => this.setState({ equipo: { ...this.state.equipo, [k]: !E[k] } }) }));
    const d = this.state.dest;
    return {
      fotos, grupos, monedas, estados, equipo,
      destChecked: d ? 'true' : 'false',
      toggleDest: () => this.setState({ dest: !d }),
      switchStyle: 'flex: none; width: 56px; height: 32px; border-radius: 16px; padding: 3px; display: flex; ' + (d ? 'background: #C8161E; justify-content: flex-end;' : 'background: #8A8A8A; justify-content: flex-start;'),
      knobStyle: 'width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; display: block;'
    };
  }
}
</script>
