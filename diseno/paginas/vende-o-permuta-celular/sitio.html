<style>
body{margin:0;background:#0B0B0B}
*{box-sizing:border-box}
a{color:#FFFFFF}a:hover{color:#FF6B71}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px;box-shadow:0 0 0 7px #0B0B0B}

<div style="font-family: 'Archivo', sans-serif; width: 390px; min-height: 2300px; background: #0B0B0B; color: #FFFFFF">
  <header style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #262626">
    <a href="Movil-Inicio.dc.html" aria-label="AutoShop Automotora, inicio" style="display: flex; align-items: center; gap: 8px; text-decoration: none">
      <img src="assets/c630baf7-aed5-4d5e-b658-b17e1cfafabb.png" alt="" style="width: 40px; height: 40px; border-radius: 50%; display: block">
      <span style="font-style: italic; font-weight: 900; font-stretch: 125%; font-size: 19px; line-height: 1">Auto<span style="color: #FF4A52">Shop</span></span>
    </a>
    <a href="Movil-Catalogo.dc.html" style="margin-left: auto; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; min-height: 44px; padding: 0 6px">Catálogo</a>
    <button type="button" aria-label="Abrir menú" style="width: 44px; height: 44px; background: transparent; border: 2px solid #3A3A3A; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
  </header>

  <main style="padding: 24px 16px 24px">
    <h1 style="margin: 0; font-style: italic; font-weight: 900; font-stretch: 125%; font-size: 36px; line-height: 0.95">Vendé o permutá <span style="color: #FF4A52">tu auto</span></h1>
    <p style="margin: 12px 0 24px; font-size: 16px; line-height: 1.45; color: #E6E6E6">Completá y te llega todo ordenado a nuestro WhatsApp.</p>

    <form aria-label="Datos de tu auto" style="display: flex; flex-direction: column; gap: 22px">
      <fieldset style="border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <legend style="padding: 0; margin-bottom: 12px; font-style: italic; font-weight: 900; font-size: 19px">Tu auto</legend>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Marca
          <input type="text" value="{{v.marca}}" sc-camel-on-change="{{on.marca}}" placeholder="Chevrolet" style="width: 100%; min-height: 52px; padding: 0 12px; background: #141414; color: #FFFFFF; border: 2px solid #3A3A3A; font-size: 17px">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Modelo
          <input type="text" value="{{v.modelo}}" sc-camel-on-change="{{on.modelo}}" placeholder="Onix" style="width: 100%; min-height: 52px; padding: 0 12px; background: #141414; color: #FFFFFF; border: 2px solid #3A3A3A; font-size: 17px">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Año
          <input type="text" inputmode="numeric" value="{{v.anio}}" sc-camel-on-change="{{on.anio}}" placeholder="2015" style="width: 100%; min-height: 52px; padding: 0 12px; background: #141414; color: #FFFFFF; border: 2px solid #3A3A3A; font-size: 17px">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Kilómetros
          <input type="text" inputmode="numeric" value="{{v.km}}" sc-camel-on-change="{{on.km}}" placeholder="98.000" style="width: 100%; min-height: 52px; padding: 0 12px; background: #141414; color: #FFFFFF; border: 2px solid #3A3A3A; font-size: 17px">
        </label>
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0">
        <legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 700">¿Tiene deuda? (patente, multas o prenda)</legend>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{deudas}}" as="o" hint-placeholder-count="3">
            <button type="button" aria-pressed="{{o.pressed}}" sc-camel-on-click="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
          </sc-for>
        </div>
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0">
        <legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 700">¿Qué buscás a cambio?</legend>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{buscas}}" as="o" hint-placeholder-count="3">
            <button type="button" aria-pressed="{{o.pressed}}" sc-camel-on-click="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
          </sc-for>
        </div>
        <sc-if value="{{pideCual}}" hint-placeholder-val="{{ true }}">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; margin-top: 12px">¿Cuál te interesa? (opcional)
            <input type="text" value="{{v.cual}}" sc-camel-on-change="{{on.cual}}" placeholder="El Yaris de U$S 7.900" style="width: 100%; min-height: 52px; padding: 0 12px; background: #141414; color: #FFFFFF; border: 2px solid #3A3A3A; font-size: 17px">
          </label>
        </sc-if>
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
        <legend style="padding: 0; margin-bottom: 12px; font-style: italic; font-weight: 900; font-size: 19px">Vos</legend>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Nombre
          <input type="text" autocomplete="given-name" value="{{v.nombre}}" sc-camel-on-change="{{on.nombre}}" placeholder="Tu nombre" style="width: 100%; min-height: 52px; padding: 0 12px; background: #141414; color: #FFFFFF; border: 2px solid #3A3A3A; font-size: 17px">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Celular
          <input type="tel" autocomplete="tel" value="{{v.cel}}" sc-camel-on-change="{{on.cel}}" placeholder="09X XXX XXX" style="width: 100%; min-height: 52px; padding: 0 12px; background: #141414; color: #FFFFFF; border: 2px solid #3A3A3A; font-size: 17px">
        </label>
      </fieldset>
    </form>

    <h2 style="margin: 32px 0 10px; font-size: 16px; font-weight: 800">Así nos llega:</h2>
    <div style="background: #ECE5DD; padding: 16px 12px; display: flex; justify-content: flex-end">
      <div style="background: #DCF8C6; color: #0B0B0B; padding: 11px 13px; font-size: 15px; line-height: 1.5; white-space: pre-line; max-width: 94%; border-radius: 10px 0 10px 10px" aria-live="polite">{{mensaje}}</div>
    </div>
    <p style="margin: 10px 0 0; font-size: 13px; color: #B8B8B8">Las fotos de tu auto mandalas en el mismo chat.</p>
  </main>

  <div style="position: sticky; bottom: 0; background: #0B0B0B; border-top: 1px solid #262626; padding: 10px 16px 14px">
    <a href="{{waLink}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; background: #25D366; color: #0B0B0B; font-weight: 900; font-size: 18px; text-decoration: none">
      <svg aria-hidden="true" width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0B0B0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5l1.3-4A8.5 8.5 0 1 1 8 19.6z"></path><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.6-2-1-1 1c-1.2-.5-2.4-1.7-2.9-2.9l1-1-1-2z"></path></svg>
      Enviar por WhatsApp
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:2300}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { v: { marca: 'Chevrolet', modelo: 'Corsa', anio: '2012', km: '145.000', cual: '', nombre: '', cel: '' }, deuda: 'No tiene', busca: 'Plata' };
  }
  renderVals() {
    const v = this.state.v;
    const set = (k) => (e) => this.setState({ v: { ...this.state.v, [k]: e.target.value } });
    const on = {};
    ['marca', 'modelo', 'anio', 'km', 'cual', 'nombre', 'cel'].forEach((k) => { on[k] = set(k); });
    const on1 = 'min-height: 52px; padding: 0 16px; text-align: left; background: #FFFFFF; color: #0B0B0B; border: 2px solid #FFFFFF; font-weight: 700; font-size: 16px;';
    const off1 = 'min-height: 52px; padding: 0 16px; text-align: left; background: #141414; color: #FFFFFF; border: 2px solid #3A3A3A; font-weight: 600; font-size: 16px;';
    const mk = (key, list) => list.map((o) => ({ label: o, pressed: this.state[key] === o ? 'true' : 'false', style: this.state[key] === o ? on1 : off1, pick: () => this.setState({ [key]: o }) }));
    const t = (x, ph) => (x && x.trim()) ? x.trim() : ph;
    const busca = this.state.busca === 'Otro auto del catálogo' ? ('Otro auto' + (v.cual ? ': ' + v.cual : '')) : this.state.busca;
    const mensaje = 'Hola AutoShop, quiero ' + (this.state.busca === 'Plata' ? 'vender' : 'permutar') + ' mi auto.\n'
      + '• Auto: ' + t(v.marca, '[marca]') + ' ' + t(v.modelo, '[modelo]') + ' ' + t(v.anio, '[año]') + '\n'
      + '• Km: ' + t(v.km, '[km]') + '\n'
      + '• Deuda: ' + this.state.deuda + '\n'
      + '• Busco a cambio: ' + busca + '\n'
      + '• Nombre: ' + t(v.nombre, '[tu nombre]') + '\n'
      + '• Celular: ' + t(v.cel, '[tu celular]') + '\n'
      + '¿Me pasan una cotización?';
    return {
      v, on,
      deudas: mk('deuda', ['No tiene', 'Sí, patente o multas', 'Sí, prenda']),
      buscas: mk('busca', ['Plata', 'Otro auto del catálogo', 'Todavía no sé']),
      pideCual: this.state.busca === 'Otro auto del catálogo',
      mensaje,
      waLink: 'https://wa.me/59898790806?text=' + encodeURIComponent(mensaje)
    };
  }
}
</script>
