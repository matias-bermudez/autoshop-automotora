<style>
body{margin:0;background:#F2F2F2}
*{box-sizing:border-box}
a{color:#0B0B0B}a:hover{color:#A30F16}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #0B0B0B;outline-offset:2px;box-shadow:0 0 0 6px #FFFFFF}

</helmet>
<div style="font-family: 'Archivo', sans-serif; width: 100%; min-height: 100vh; background: #F2F2F2; color: #0B0B0B">
  <header style="background: #0B0B0B; color: #FFFFFF">
    <div style="padding: 10px 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px">
      <img src="assets/a66e928e-f364-4978-b772-82ffe1d8118e.png" alt="AutoShop" style="width: 40px; height: 40px; border-radius: 50%">
      <nav aria-label="Panel" style="display: flex; gap: 4px">
        <a href="Panel-Escritorio.dc.html" aria-current="page" style="color: #FFFFFF; font-weight: 800; text-decoration: none; padding: 12px 14px; box-shadow: inset 0 -3px 0 #C8161E">Mis autos</a>
        <a href="Panel-Escritorio-Negocio.dc.html" style="color: #D0D0D0; font-weight: 600; text-decoration: none; padding: 12px 14px">Datos del negocio</a>
      </nav>
      <a href="Main.dc.html" style="margin-left: auto; color: #FFFFFF; font-weight: 700; font-size: 15px">Ver la web</a>
    </div>
  </header>

  <div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px 28px 48px; align-items: flex-start">
    <!-- Lista -->
    <section aria-labelledby="h-lista" style="flex: 1 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #D6D6D6">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid #D6D6D6">
        <h1 id="h-lista" style="margin: 0; font-style: italic; font-weight: 900; font-stretch: 115%; font-size: 24px">Mis autos</h1>
        <span style="font-size: 14px; color: #4A4A4A">{{resumen}}</span>
        <button type="button" style="margin-left: auto; min-height: 44px; padding: 0 16px; background: #C8161E; color: #FFFFFF; border: 0; font-weight: 800">+ Agregar auto</button>
      </div>
      <div style="overflow-x: auto">
        <div style="min-width: 520px; font-size: 15px">
          <div style="display: grid; grid-template-columns: 1fr 110px 120px 90px; padding: 10px 18px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #4A4A4A; font-weight: 800">
            <span>Auto</span><span>Precio</span><span>Estado</span><span></span>
          </div>
          <ul style="list-style: none; margin: 0; padding: 0">
            <sc-for list="{{lista}}" as="a" hint-placeholder-count="9">
              <li style="{{a.rowStyle}}">
                <div style="display: flex; align-items: center; gap: 12px; min-width: 0">
                  <img src="{{a.img}}" alt="" style="width: 80px; height: 60px; object-fit: cover; display: block; flex: none">
                  <div style="min-width: 0">
                    <div style="font-weight: 800">{{a.nombre}}</div>
                    <div style="font-size: 13px; color: #4A4A4A">{{a.suc}}{{a.destTxt}}</div>
                  </div>
                </div>
                <span style="font-style: italic; font-weight: 900; font-stretch: 75%; font-size: 20px; white-space: nowrap">U$S {{a.num}}</span>
                <span><span style="{{a.estadoStyle}}">{{a.estado}}</span></span>
                <span style="text-align: right"><button type="button" sc-camel-on-click="{{a.pick}}" aria-pressed="{{a.sel}}" style="min-height: 44px; padding: 0 14px; background: #FFFFFF; border: 2px solid #0B0B0B; font-weight: 700">Editar</button></span>
              </li>
            </sc-for>
          </ul>
        </div>
      </div>
    </section>

    <!-- Editor -->
    <section aria-labelledby="h-editor" style="flex: 1 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #D6D6D6; border-top: 5px solid #C8161E">
      <div style="padding: 18px 22px; border-bottom: 1px solid #D6D6D6; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
        <h2 id="h-editor" style="margin: 0; font-size: 22px; font-weight: 800">Editar: {{cur.nombre}}</h2>
        <a href="Ficha.dc.html" style="margin-left: auto; font-weight: 700; font-size: 15px">Ver ficha en la web</a>
      </div>
      <form aria-label="Datos del auto" style="padding: 20px 22px; display: flex; flex-direction: column; gap: 22px">
        <fieldset style="border: 0; margin: 0; padding: 0">
          <legend style="padding: 0; margin-bottom: 10px; font-size: 16px; font-weight: 800">Fotos <span style="font-weight: 500; color: #4A4A4A; font-size: 14px">· arrastrá para ordenar, la primera es la portada</span></legend>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
            <div style="position: relative; aspect-ratio: 4 / 3; outline: 3px solid #C8161E; outline-offset: -3px">
              <img src="{{cur.img}}" alt="Foto 1, portada" style="width: 100%; height: 100%; object-fit: cover; display: block">
              <span style="position: absolute; left: 0; top: 0; background: #C8161E; color: #FFFFFF; font-size: 11px; font-weight: 800; padding: 2px 6px; text-transform: uppercase">Portada</span>
            </div>
            <div style="aspect-ratio: 4 / 3; background: repeating-linear-gradient(135deg, #E6E6E6 0 8px, #F2F2F2 8px 16px); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #4A4A4A">[Foto 2]</div>
            <div style="aspect-ratio: 4 / 3; background: repeating-linear-gradient(135deg, #E6E6E6 0 8px, #F2F2F2 8px 16px); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #4A4A4A">[Foto 3]</div>
            <button type="button" style="aspect-ratio: 4 / 3; border: 2px dashed #8A8A8A; background: #FAFAFA; font-size: 14px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #0B0B0B">
              <svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0B0B0B" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
              Subir fotos
            </button>
          </div>
        </fieldset>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Marca<input type="text" value="{{cur.marca}}" style="min-height: 48px; padding: 0 12px; border: 2px solid #8A8A8A; font-size: 16px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Modelo<input type="text" value="{{cur.modelo}}" style="min-height: 48px; padding: 0 12px; border: 2px solid #8A8A8A; font-size: 16px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Versión<input type="text" placeholder="[VERSIÓN]" style="min-height: 48px; padding: 0 12px; border: 2px solid #8A8A8A; font-size: 16px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Año<input type="text" placeholder="[AÑO]" style="min-height: 48px; padding: 0 12px; border: 2px solid #8A8A8A; font-size: 16px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Kilómetros<input type="text" placeholder="[KM]" style="min-height: 48px; padding: 0 12px; border: 2px solid #8A8A8A; font-size: 16px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Sucursal<input type="text" value="{{cur.suc}}" style="min-height: 48px; padding: 0 12px; border: 2px solid #8A8A8A; font-size: 16px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Combustible<input type="text" value="Nafta" style="min-height: 48px; padding: 0 12px; border: 2px solid #8A8A8A; font-size: 16px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Caja<input type="text" placeholder="[CAJA]" style="min-height: 48px; padding: 0 12px; border: 2px solid #8A8A8A; font-size: 16px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Tipo<input type="text" value="{{cur.tipo}}" style="min-height: 48px; padding: 0 12px; border: 2px solid #8A8A8A; font-size: 16px"></label>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 16px; background: #F7F7F7; border: 1px solid #E0E0E0">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Precio (U$S)<input type="text" value="{{cur.num}}" style="min-height: 52px; padding: 0 12px; border: 2px solid #8A8A8A; font-size: 20px; font-weight: 800"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Cuota aprox. 60 meses ($)<input type="text" value="{{cur.cuota}}" style="min-height: 52px; padding: 0 12px; border: 2px solid #8A8A8A; font-size: 18px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Entrega en clearing (%)<input type="text" value="{{cur.pct}}" style="min-height: 52px; padding: 0 12px; border: 2px solid #8A8A8A; font-size: 18px"></label>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center">
          <div role="group" aria-label="Estado" style="display: flex; border: 2px solid #0B0B0B">
            <sc-for list="{{estados}}" as="e" hint-placeholder-count="3">
              <button type="button" aria-pressed="{{e.pressed}}" sc-camel-on-click="{{e.pick}}" style="{{e.style}}">{{e.label}}</button>
            </sc-for>
          </div>
          <button type="button" role="switch" aria-checked="{{destChecked}}" sc-camel-on-click="{{toggleDest}}" style="display: flex; align-items: center; gap: 10px; min-height: 48px; border: 0; background: transparent; font-weight: 700; font-size: 15px; color: #0B0B0B">
            <span style="{{switchStyle}}"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; display: block"></span></span>
            Destacado en el inicio
          </button>
        </div>

        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Equipamiento (separado por comas)<input type="text" placeholder="[Aire acondicionado, ABS, Airbags…]" style="min-height: 48px; padding: 0 12px; border: 2px solid #8A8A8A; font-size: 16px"></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Descripción<textarea rows="4" placeholder="[DESCRIPCIÓN DEL VENDEDOR]" style="padding: 12px; border: 2px solid #8A8A8A; font-size: 16px; line-height: 1.45"></textarea></label>

        <div style="display: flex; gap: 10px; justify-content: flex-end">
          <button type="button" style="min-height: 52px; padding: 0 22px; background: #FFFFFF; border: 2px solid #0B0B0B; font-weight: 700">Descartar</button>
          <button type="button" style="min-height: 52px; padding: 0 28px; background: #C8161E; color: #FFFFFF; border: 0; font-weight: 900; font-size: 17px">Guardar cambios</button>
        </div>
      </form>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1400}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      sel: 'civic10',
      autos: [
        { id: 'civic10', marca: 'Honda', modelo: 'Civic', tipo: 'Sedán', usd: 16900, cuota: 15000, pct: 50, suc: 'Batlle y Ordóñez', estado: 'Disponible', dest: true, img: '/_blob/6370b0cd4485e77db03eaf1f7ea473e7' },
        { id: 'aqua', marca: 'Toyota', modelo: 'Aqua', tipo: 'Hatchback', usd: 12900, cuota: 11900, pct: 50, suc: 'Batlle y Ordóñez', estado: 'Disponible', dest: true, img: '/_blob/9cf1fe16f69326749f739d284ca43c44' },
        { id: 'onix', marca: 'Chevrolet', modelo: 'Onix', tipo: 'Hatchback', usd: 12900, cuota: 11900, pct: 50, suc: 'Batlle y Ordóñez', estado: 'Reservado', dest: false, img: '/_blob/da5fe687ff89811db5a5240669824cf4' },
        { id: 'civic8', marca: 'Honda', modelo: 'Civic', tipo: 'Sedán', usd: 10900, cuota: 9900, pct: 50, suc: 'Batlle y Ordóñez', estado: 'Disponible', dest: true, img: '/_blob/f20f0d29903922ae8e7f823ccc9cf12a' },
        { id: 'celysee', marca: 'Citroën', modelo: 'C-Elysée', tipo: 'Sedán', usd: 10500, cuota: 9500, pct: 50, suc: 'Batlle y Ordóñez', estado: 'Disponible', dest: false, img: '/_blob/62ac4c8689601be7e28a0645c2d8cd16' },
        { id: 'p308', marca: 'Peugeot', modelo: '308', tipo: 'Hatchback', usd: 10500, cuota: 9500, pct: 50, suc: 'Batlle y Ordóñez', estado: 'Disponible', dest: false, img: '/_blob/d9a7ec5f39c90257835e65e9316f4559' },
        { id: 'yaris', marca: 'Toyota', modelo: 'Yaris', tipo: 'Sedán', usd: 7900, cuota: 6900, pct: 50, suc: 'Eugenio Garzón', estado: 'Disponible', dest: true, img: '/_blob/bd03d8ff498b452b07b0960f638bce29' },
        { id: 'sedan', marca: '[MARCA]', modelo: '[MODELO]', tipo: 'Sedán', usd: 7200, cuota: 6200, pct: 50, suc: 'Batlle y Ordóñez', estado: 'Disponible', dest: false, img: '/_blob/7aaf4a89cfc43f88ea9d7cab0975e92a' },
        { id: 'lifan', marca: 'Lifan', modelo: '320', tipo: 'Hatchback', usd: 4900, cuota: 3900, pct: 60, suc: 'Eugenio Garzón', estado: 'Disponible', dest: false, img: '/_blob/85c68a14a73ae539eda1b88864eb045d' }
      ]
    };
  }
  renderVals() {
    const fm = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const A = this.state.autos;
    const upd = (id, patch) => this.setState({ autos: this.state.autos.map((a) => a.id === id ? { ...a, ...patch } : a) });
    const col = { Disponible: ['#E3F4E8', '#1F7A3A'], Reservado: ['#FFF1D6', '#7A4F00'], Vendido: ['#E6E6E6', '#3D3D3D'] };
    const lista = A.map((a) => ({
      ...a,
      nombre: a.marca + ' ' + a.modelo,
      num: fm(a.usd),
      destTxt: a.dest ? ' · Destacado' : '',
      sel: this.state.sel === a.id ? 'true' : 'false',
      pick: () => this.setState({ sel: a.id }),
      rowStyle: 'display: grid; grid-template-columns: 1fr 110px 120px 90px; align-items: center; gap: 8px; padding: 8px 18px; border-top: 1px solid #E6E6E6; ' + (this.state.sel === a.id ? 'background: #FFF0F0; box-shadow: inset 4px 0 0 #C8161E;' : ''),
      estadoStyle: 'display: inline-block; padding: 4px 10px; font-size: 13px; font-weight: 800; background: ' + col[a.estado][0] + '; color: ' + col[a.estado][1] + ';'
    }));
    const c = A.find((a) => a.id === this.state.sel) || A[0];
    const cur = { ...c, nombre: c.marca + ' ' + c.modelo, num: fm(c.usd), cuota: fm(c.cuota), pct: String(c.pct) };
    const seg = (on) => 'min-height: 48px; padding: 0 16px; border: 0; font-weight: 800; font-size: 15px; ' + (on ? 'background: #0B0B0B; color: #FFFFFF;' : 'background: #FFFFFF; color: #0B0B0B;');
    const estados = ['Disponible', 'Reservado', 'Vendido'].map((e) => ({ label: e, pressed: c.estado === e ? 'true' : 'false', style: seg(c.estado === e), pick: () => upd(c.id, { estado: e }) }));
    const n = (e) => A.filter((a) => a.estado === e).length;
    return {
      lista, cur, estados,
      resumen: n('Disponible') + ' disponibles · ' + n('Reservado') + ' reservados · ' + n('Vendido') + ' vendidos',
      destChecked: c.dest ? 'true' : 'false',
      toggleDest: () => upd(c.id, { dest: !c.dest }),
      switchStyle: 'flex: none; width: 52px; height: 30px; border-radius: 15px; padding: 3px; display: flex; ' + (c.dest ? 'background: #C8161E; justify-content: flex-end;' : 'background: #8A8A8A; justify-content: flex-start;')
    };
  }
}
</script>
